name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    # Standard runners are free for public repos; skip if made private.
    if: github.event.repository.private == false
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and zip Apple Silicon app
        run: |
          make app
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${GITHUB_REF_NAME#v}" "build/Dynamic Cursors.app/Contents/Info.plist"
          codesign --force --sign - "build/Dynamic Cursors.app"
          ditto -c -k --sequesterRsrc --keepParent "build/Dynamic Cursors.app" "build/Dynamic-Cursors-macos-arm64.zip"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "build/Dynamic-Cursors-macos-arm64.zip" --verify-tag --generate-notes
